name: Lift planner test

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Run the headless end-to-end test
        run: python tools/test/liftplan.py tools/test/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-pdf
          path: tools/test/out

  # Publishes public/ to the Netlify site once the tests pass on the default branch.
  # Needs the NETLIFY_AUTH_TOKEN repository secret (Netlify > User settings > Applications >
  # Personal access tokens); the job is skipped while the secret is missing.
  deploy:
    needs: e2e
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 498bcf24-bc92-419a-8c0f-dc18a5f9f2b1
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx -y netlify-cli deploy --prod --dir=public --site="$NETLIFY_SITE_ID" --message="${{ github.sha }}"
      - name: Secret missing
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "NETLIFY_AUTH_TOKEN is not set – skipping the Netlify deploy."
